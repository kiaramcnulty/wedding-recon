name: filter-recon-daily

# Daily on-write filter reconciliation. A DB trigger (migration 0038) stamps
# vendors.filters_dirty_at whenever recon changes; this reconciles the tags for
# the stamped vendors from all of their active recon entries, on the Batch API.
# See docs/filter-recon-on-write.md.
#
# The schedule is ENABLED (Kiara, 2026-08-13), after a hand pilot on 8 vendors
# proved the trigger, the export/build/submit/collect path and the apply. Note
# what that pilot did NOT exercise: it produced zero writes, so create/extend/
# overwrite/retract and a real restore are still unproven in anger, as is the
# per-key manual (LOCKED) guard - no manual-provenance key exists in the corpus
# yet. This mutates user-visible data on model judgment and the snapshot is the
# only undo, so read the report artifact after the first few real runs.
#
# The cron WRITES (Kiara, 2026-08-13). A scheduled run gets no inputs context,
# so the apply test is inverted - apply is the default and only an explicit
# dry_run=true holds back. A run you trigger by hand still defaults to a dry run;
# only the unattended schedule writes.
#
# So: from 09:40 UTC daily, vendors.filters is updated from recon on model
# judgment with no human in front of it. If one looks wrong, the run workdir
# holds a pre-run snapshot and restore.mjs reverts it - but that workdir lives on
# the runner, so PULL THE filter-recon-report ARTIFACT before it expires if a run
# writes something you want to inspect or undo.
#
# Requires repo secrets: NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
# ANTHROPIC_BATCH_API_KEY (same set the SessionStart hook reads). Scheduled runs
# only fire from the DEFAULT branch, so this has no effect until it is on main.

on:
  schedule:
    - cron: "40 9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (report only, write nothing)"
        type: boolean
        default: true

concurrency:
  group: filter-recon-daily
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    # Must exceed the batch poll window below (150 min) plus setup, or the job is
    # killed mid-poll and the batch is abandoned - the exact loop that window is
    # sized to avoid.
    timeout-minutes: 180
    # issues:write lets the notify step open an issue when the miner adds recon
    # (the cheapest report-to-your-inbox that needs no new secret).
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install --no-audit --no-fund

      - name: Build .env.local from secrets
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_BATCH_API_KEY: ${{ secrets.ANTHROPIC_BATCH_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          umask 077
          : > .env.local
          for v in NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY ANTHROPIC_BATCH_API_KEY; do
            val="${!v:-}"
            if [ -z "$val" ]; then echo "::error::$v secret is not set"; exit 1; fi
            printf '%s=%s\n' "$v" "$val" >> .env.local
          done
          # Optional: the website backfill uses this and skips cleanly without it,
          # so a missing secret is a warning, not a failed job.
          if [ -n "${GOOGLE_PLACES_API_KEY:-}" ]; then
            printf '%s=%s\n' GOOGLE_PLACES_API_KEY "$GOOGLE_PLACES_API_KEY" >> .env.local
          else
            echo "::warning::GOOGLE_PLACES_API_KEY not set; website backfill will be skipped"
          fi

      - name: Reconcile dirty vendors
        run: |
          set -euo pipefail
          WORK="daily-$(date -u +%Y%m%d-%H%M)"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          DIR="data/reconcile/$WORK"

          # A scheduled run carries no inputs context, so inputs.dry_run is the
          # empty string and APPLY becomes --apply (the schedule writes). A run
          # triggered by hand defaults dry_run=true, so APPLY is empty (dry run).
          # This one flag gates every writing step below, so they cannot disagree.
          if [ "${{ inputs.dry_run }}" = "true" ]; then APPLY=""; else APPLY="--apply"; fi

          # The website tag/recon MINER is shipped OFF: it auto-authors recon and
          # has only ever run in dry-run. MINE_FLAG="--no-mine" holds back site
          # fetching in build-calls AND skips the mine-apply step below - the two
          # must move together, or a stray hallucinated `site` from a call that
          # carried no website would still be inserted. Pilot by hand
          # (docs/filter-recon-on-write.md), then set MINE_FLAG="" to enable.
          MINE_FLAG="--no-mine"

          node scripts/reconcile/daily-export.mjs --work "$WORK"

          # No dirty vendors -> vendors.jsonl has no objects. Stop cleanly rather
          # than letting `batch submit` fail on an empty call set.
          if ! grep -q '{' "$DIR/vendors.jsonl"; then
            echo "Nothing dirty. Done."
            exit 0
          fi

          # Website backfill (deterministic, Google Places) - runs first so the
          # tag/recon miner downstream sees a site that was just found. Covers
          # every dirty vendor including `other`. Skips cleanly with no Places key.
          node scripts/reconcile/daily-websites.mjs --work "$WORK" $APPLY

          node scripts/reconcile/daily-build-calls.mjs --work "$WORK" $MINE_FLAG

          # build-calls emits no call file for a dirty vendor whose type has no
          # filter vocabulary (currently `other`), so an all-`other` dirty set
          # yields zero calls. Guard: with zero calls `batch submit` exits 1 and
          # fails the job (the 2026-08-17 failure). Nothing to submit is a clean
          # no-op, not a failure - the website backfill above still ran for them.
          if ! ls "$DIR"/calls/call-*.json >/dev/null 2>&1; then
            echo "No call files built. Nothing to reconcile. Done."
            exit 0
          fi

          node scripts/reconcile/batch.mjs submit --work "$WORK"

          # Poll until the batch ends, capped so a stuck batch cannot hang the job.
          # If it does not end in time, leave the vendors dirty; the next run
          # re-exports them - but note that also means it SUBMITS A FRESH BATCH,
          # so a window shorter than the real batch latency is a loop that pays
          # for a batch every day and collects none of them. The hand pilot on
          # 2026-08-12 took ~70 minutes end to end for two calls, so 60 was under
          # the observed latency. Public repo, so runner minutes are free and the
          # generous window costs nothing; the poll exits as soon as it ends, and
          # a day with nothing dirty leaves the job in seconds.
          # A resumable collect (submit one day, collect the next) is still the
          # right fix if batch latency ever exceeds this window routinely.
          ended=""
          for _ in $(seq 1 150); do
            if node scripts/reconcile/batch.mjs status --work "$WORK" | grep -q ': ended'; then
              ended=1; break
            fi
            sleep 60
          done
          if [ -z "$ended" ]; then
            echo "::warning::batch did not end within the poll window; vendors stay dirty"
            exit 0
          fi

          node scripts/reconcile/batch.mjs collect --work "$WORK"

          # $APPLY (set at the top of this step) is --apply on the schedule and
          # empty on a hand-triggered dry run. Deliberately inverted: apply is the
          # default and only an explicit dry_run=true holds back, so the cron
          # cannot quietly never write - the green-but-did-nothing failure.
          node scripts/reconcile/daily-apply.mjs --work "$WORK" $APPLY

          # Website-mining half: insert the recon entries + tags the model drafted
          # from vendors' own sites (the `site` field of the same result). Gated by
          # MINE_FLAG so it turns on together with the site fetching above and never
          # applies a `site` the build step did not request. Separate script so
          # every recon-AUTHORING guard lives in one place and the tag-only
          # reconcile above is untouched.
          if [ -z "$MINE_FLAG" ]; then
            node scripts/reconcile/daily-mine-apply.mjs --work "$WORK" $APPLY
          fi

      - name: Notify on added recon
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DIR="data/reconcile/${WORK:-none}"
          # mine-applied.jsonl exists only on an --apply run that inserted at least
          # one entry, so this fires exactly when there is something to report.
          if [ -s "$DIR/mine-applied.jsonl" ]; then
            n=$(grep -c '{' "$DIR/mine-applied.jsonl" || true)
            gh issue create \
              --title "Website miner added $n recon entries ($WORK)" \
              --body-file "$DIR/mine-report.md" \
              || echo "::warning::could not open the notification issue"
          else
            echo "No recon added this run; no notification."
          fi

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filter-recon-report
          # The snapshot is not a nice-to-have here: it is the ONLY undo, and the
          # runner is destroyed when the job ends. Without it in the artifact, a
          # scheduled run that writes something wrong cannot be reverted at all -
          # restore.mjs reads snapshot/vendors-filters.jsonl and
          # snapshot/recon-entries.jsonl and there is nowhere else to get them.
          # To undo a run: download this artifact into data/reconcile/<WORK>/ and
          # run `node scripts/reconcile/restore.mjs --work <WORK> --apply`.
          # It is small - 24 KB for the 8-vendor pilot.
          # applied.jsonl says what was written, results.jsonl says why.
          path: |
            data/reconcile/${{ env.WORK }}/report.md
            data/reconcile/${{ env.WORK }}/mine-report.md
            data/reconcile/${{ env.WORK }}/export-report.txt
            data/reconcile/${{ env.WORK }}/applied.jsonl
            data/reconcile/${{ env.WORK }}/mine-applied.jsonl
            data/reconcile/${{ env.WORK }}/results.jsonl
            data/reconcile/${{ env.WORK }}/snapshot/**
          retention-days: 90
          if-no-files-found: ignore
